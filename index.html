<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>水果消消乐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(140deg, #ff5e78 0%, #ff9f43 55%, #ffcf69 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 12px 24px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overflow-x: hidden;
  }

  /* 背景漂浮装饰水果 */
  .bg-fruit {
    position: fixed; z-index: 0;
    font-size: 58px; opacity: .22;
    pointer-events: none;
    animation: floaty 7s ease-in-out infinite;
  }
  .f1 { left: 5%;  top: 9%; }
  .f2 { right: 6%; top: 14%; animation-delay: -2s; }
  .f3 { left: 8%;  bottom: 10%; animation-delay: -4s; }
  .f4 { right: 5%; bottom: 16%; animation-delay: -5.5s; }
  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    50%      { transform: translateY(-22px) rotate(10deg); }
  }

  .wrap {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
  }
  .title {
    color: #fff;
    font-size: clamp(26px, 7vw, 36px);
    font-weight: 900;
    letter-spacing: 3px;
    text-shadow: 0 3px 0 rgba(160, 40, 60, .28), 0 6px 16px rgba(0, 0, 0, .15);
    margin-bottom: 12px;
    white-space: nowrap;
  }

  /* 计分板 */
  .scoreboard { display: flex; gap: 10px; width: 100%; margin-bottom: 12px; }
  .stat {
    flex: 1;
    background: rgba(255, 255, 255, .94);
    border-radius: 16px;
    padding: 7px 12px 9px;
    display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .14);
  }
  .stat .label { font-size: 12px; color: #9b9b9b; font-weight: 700; letter-spacing: 1px; }
  .stat .value { font-size: 25px; font-weight: 900; line-height: 1.15; }
  #scoreVal { color: #ff4757; }
  #movesVal { color: #3742fa; }
  #movesBox.low #movesVal { color: #ff3838; animation: pulseLow .9s infinite; }
  @keyframes pulseLow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.22); } }
  .restart-btn {
    border: none; border-radius: 16px;
    background: #2f3542; color: #fff;
    font-size: 15px; font-weight: 800;
    padding: 0 20px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
    transition: transform .12s, background .15s;
  }
  .restart-btn:hover { background: #40485a; }
  .restart-btn:active { transform: scale(.93); }

  /* 音效开关 */
  .sound-btn {
    position: fixed;
    top: 12px; right: 12px;
    width: 44px; height: 44px;
    border: none; border-radius: 50%;
    background: rgba(255, 255, 255, .94);
    font-size: 20px; line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .16);
    z-index: 90;
    transition: transform .12s, opacity .15s;
  }
  .sound-btn:active { transform: scale(.88); }
  .sound-btn.off { opacity: .55; }

  /* 棋盘 */
  .board-wrap {
    background: rgba(255, 255, 255, .5);
    padding: 9px;
    border-radius: 22px;
    box-shadow: 0 12px 34px rgba(120, 30, 40, .25);
  }
  #board {
    --cell: 40px;
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    touch-action: none;
    background: repeating-conic-gradient(#fff3d6 0% 25%, #fffdf2 0% 50%)
                0 0 / calc(var(--cell) * 2) calc(var(--cell) * 2);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .65);
  }

  /* 水果块 */
  .tile {
    position: absolute; left: 0; top: 0;
    transition: transform .27s cubic-bezier(.25, .8, .35, 1.12);
    will-change: transform;
  }
  .tile-inner {
    position: absolute; inset: 7%;
    display: flex; align-items: center; justify-content: center;
    font-size: var(--fruit-size, 24px);
    line-height: 1;
    border-radius: 26%;
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .05);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .t0 .tile-inner { background: #ffd6d6; }
  .t1 .tile-inner { background: #ffe8c2; }
  .t2 .tile-inner { background: #e8d9ff; }
  .t3 .tile-inner { background: #ffd6ec; }
  .t4 .tile-inner { background: #d9f5da; }
  .t5 .tile-inner { background: #ffe0c9; }

  .tile.selected { z-index: 5; }
  .tile.selected .tile-inner {
    box-shadow: 0 0 0 3px #ff9f1a, 0 5px 12px rgba(0, 0, 0, .22);
    animation: selBounce .55s infinite alternate ease-in-out;
  }
  @keyframes selBounce { from { transform: scale(1.08); } to { transform: scale(1.22); } }

  .tile.born .tile-inner { animation: bornIn .32s backwards; }
  @keyframes bornIn { from { transform: scale(0); } }

  .tile.invalid .tile-inner { animation: shake .34s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-14%) rotate(-6deg); }
    75%      { transform: translateX(14%) rotate(6deg); }
  }

  .tile.shuffle-out .tile-inner { animation: shuffleOut .36s forwards ease-in; }
  @keyframes shuffleOut { to { transform: scale(0) rotate(-100deg); opacity: 0; } }

  .tile.pop { z-index: 6; }
  .tile.pop .tile-inner { animation: popAway .33s forwards ease-in; }
  @keyframes popAway {
    40%  { transform: scale(1.5) rotate(10deg); opacity: 1; }
    100% { transform: scale(1.9) rotate(18deg); opacity: 0; }
  }

  /* 得分飘字 */
  .float-text {
    position: absolute; z-index: 20;
    pointer-events: none; white-space: nowrap;
    transform: translate(-50%, 0);
    font-size: 19px; font-weight: 900; color: #ff4757;
    text-shadow: 0 2px 0 #fff, 0 0 8px #fff;
    animation: riseUp .85s forwards ease-out;
  }
  .float-text.combo { font-size: 25px; color: #a55eea; }
  @keyframes riseUp {
    0%  { opacity: 0; transform: translate(-50%, 8px) scale(.5); }
    22% { opacity: 1; transform: translate(-50%, -8px) scale(1.18); }
    100% { opacity: 0; transform: translate(-50%, -58px) scale(1); }
  }

  /* 连击横幅 */
  .combo-banner {
    position: fixed; left: 50%; top: 34%;
    font-size: clamp(30px, 8vw, 46px);
    font-weight: 900; color: #fff;
    text-shadow: 0 0 16px #ff3f6c, 0 4px 0 rgba(120, 20, 40, .35);
    z-index: 50; pointer-events: none; opacity: 0;
    transform: translate(-50%, -50%) scale(.3);
  }
  .combo-banner.show { animation: comboPop 1s forwards; }
  @keyframes comboPop {
    0%  { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-8deg); }
    28% { opacity: 1; transform: translate(-50%, -50%) scale(1.18) rotate(3deg); }
    42% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    78% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -62%) scale(1.02); }
  }

  /* 提示条 */
  .toast {
    position: fixed; top: 15%; left: 50%;
    transform: translateX(-50%) translateY(-8px);
    background: rgba(25, 25, 40, .88); color: #fff;
    padding: 12px 26px; border-radius: 999px;
    font-size: 16px; font-weight: 700;
    z-index: 60; opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
    white-space: nowrap;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 游戏结束弹层 */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(25, 22, 38, .58);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    transition: opacity .3s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay-card {
    background: #fff;
    border-radius: 26px;
    padding: 34px 46px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
    animation: cardIn .4s backwards cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes cardIn { from { transform: scale(.55); opacity: 0; } }
  .overlay-emoji { font-size: 54px; }
  .overlay-card h2 { color: #2f3542; font-size: 24px; margin: 10px 0 8px; }
  .final-line { color: #636e72; font-size: 17px; }
  .final-line b { font-size: 30px; color: #ff4757; margin-left: 4px; }
  #againBtn {
    margin-top: 20px;
    border: none;
    background: linear-gradient(135deg, #ff6b6b, #ff9f43);
    color: #fff; font-size: 17px; font-weight: 800;
    padding: 13px 42px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(255, 107, 107, .45);
    transition: transform .12s;
  }
  #againBtn:active { transform: scale(.94); }

  .tip {
    margin-top: 12px;
    color: rgba(255, 255, 255, .96);
    font-size: 13px;
    text-shadow: 0 1px 3px rgba(120, 30, 40, .3);
    text-align: center;
  }
</style>
</head>
<body>

<div class="bg-fruit f1">🍊</div>
<div class="bg-fruit f2">🍇</div>
<div class="bg-fruit f3">🍓</div>
<div class="bg-fruit f4">🍒</div>

<button class="sound-btn" id="soundBtn" title="音效开关">🔊</button>

<div class="wrap">
  <h1 class="title">🍉 水果消消乐 🍓</h1>
  <div class="scoreboard">
    <div class="stat">
      <span class="label">得分</span>
      <span class="value" id="scoreVal">0</span>
    </div>
    <button class="restart-btn" id="restartBtn" title="重新开始">↻ 重开</button>
    <div class="stat" id="movesBox">
      <span class="label">剩余步数</span>
      <span class="value" id="movesVal">30</span>
    </div>
  </div>
  <div class="board-wrap">
    <div id="board"></div>
  </div>
  <p class="tip">点击 / 滑动相邻水果交换位置，凑齐 3 个及以上相同水果即可消除</p>
</div>

<div class="combo-banner" id="comboBanner"></div>
<div class="toast" id="toast"></div>

<div class="overlay hidden" id="overlay">
  <div class="overlay-card" id="overlayCard">
    <div class="overlay-emoji">🏁</div>
    <h2>步数用完啦！</h2>
    <p class="final-line">最终得分<b id="finalScore">0</b></p>
    <button id="againBtn">🍎 再来一局</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  const SIZE = 10;
  const FRUITS = ['🍎', '🍊', '🍇', '🍓', '🍒', '🍑'];
  const START_MOVES = 30;
  const POINTS = 10; // 每个水果的基础分

  const boardEl = document.getElementById('board');
  const wrapEl = document.querySelector('.wrap');
  const scoreEl = document.getElementById('scoreVal');
  const movesEl = document.getElementById('movesVal');
  const movesBox = document.getElementById('movesBox');
  const toastEl = document.getElementById('toast');
  const comboEl = document.getElementById('comboBanner');
  const overlayEl = document.getElementById('overlay');
  const overlayCard = document.getElementById('overlayCard');
  const finalScoreEl = document.getElementById('finalScore');

  let board = [];                 // board[r][c] -> tile 对象或 null
  let score = 0;
  let moves = START_MOVES;
  let busy = false;               // 动画进行中，锁定输入
  let gameOver = false;
  let selected = null;            // 当前选中的 tile
  let cell = 40;                  // 格子边长 px
  let gen = 0;                    // 局次代号，用于作废过期的异步流程

  const sleep = ms => new Promise(res => setTimeout(res, ms));
  const randType = () => Math.floor(Math.random() * FRUITS.length);

  /* ---------- 音效：Web Audio 实时合成，无任何外部音频文件 ---------- */
  const Sound = (function () {
    const KEY = 'fruit-m3-sound';
    let ctx = null;
    let master = null;
    let enabled = localStorage.getItem(KEY) !== 'off';

    // 浏览器要求音频必须由用户手势激活
    function unlock() {
      if (!enabled) return;
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.9;
        master.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume();
    }

    function live() {
      return enabled && ctx && ctx.state === 'running';
    }

    // 一个带包络的单音；f1 存在时做滑音
    function tone(f0, dur, type, vol, delay, f1) {
      const t0 = ctx.currentTime + (delay || 0);
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(f0, t0);
      if (f1) osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.02, dur / 3));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g);
      g.connect(master);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    }

    return {
      unlock,
      isOn: () => enabled,
      setEnabled(v) {
        enabled = !!v;
        try { localStorage.setItem(KEY, enabled ? 'on' : 'off'); } catch (e) {}
        if (enabled) unlock();
        if (master) master.gain.value = enabled ? 0.9 : 0;
        return enabled;
      },
      // 选中水果：清脆短音
      tap() {
        if (!live()) return;
        tone(900, 0.06, 'sine', 0.1);
      },
      // 交换：两声快速音
      swap() {
        if (!live()) return;
        tone(520, 0.06, 'triangle', 0.07);
        tone(680, 0.07, 'triangle', 0.07, 0.055);
      },
      // 无效交换：低频嗡嗡
      invalid() {
        if (!live()) return;
        tone(200, 0.17, 'square', 0.055, 0, 118);
        tone(150, 0.17, 'square', 0.04, 0.015, 95);
      },
      // 消除：音高随连击升高
      match(combo) {
        if (!live()) return;
        const c = Math.min(combo, 6);
        const base = 520 + c * 75;
        tone(base, 0.1, 'triangle', 0.1);
        tone(base * 1.5, 0.11, 'triangle', 0.075, 0.025);
        if (c >= 2) tone(base * 2, 0.13, 'sine', 0.07, 0.05);
        if (c >= 4) tone(base * 2.5, 0.16, 'sine', 0.06, 0.08);
      },
      // 水果下落：轻微闷响
      drop() {
        if (!live()) return;
        tone(135, 0.07, 'sine', 0.04);
      },
      // 无可用步数：下行提示
      noMoves() {
        if (!live()) return;
        tone(620, 0.13, 'triangle', 0.07, 0, 420);
      },
      // 洗牌：扫频 + 零星光点
      shuffle() {
        if (!live()) return;
        tone(260, 0.45, 'sawtooth', 0.045, 0, 900);
        tone(1150, 0.1, 'sine', 0.05, 0.12);
        tone(1450, 0.1, 'sine', 0.05, 0.22);
        tone(1800, 0.12, 'sine', 0.045, 0.32);
      },
      // 开局 / 重开：上行小铃
      start() {
        if (!live()) return;
        tone(523, 0.11, 'triangle', 0.09);
        tone(659, 0.11, 'triangle', 0.08, 0.1);
        tone(784, 0.16, 'triangle', 0.07, 0.2);
      },
      // 游戏结束：下行三音 + 低音收尾
      over() {
        if (!live()) return;
        tone(620, 0.16, 'triangle', 0.09);
        tone(470, 0.16, 'triangle', 0.09, 0.15);
        tone(330, 0.28, 'triangle', 0.08, 0.3);
        tone(110, 0.35, 'sine', 0.05, 0.3);
      }
    };
  })();

  const soundBtn = document.getElementById('soundBtn');
  function renderSoundBtn() {
    const on = Sound.isOn();
    soundBtn.textContent = on ? '🔊' : '🔇';
    soundBtn.classList.toggle('off', !on);
    soundBtn.title = on ? '音效已开启，点击静音' : '音效已关闭，点击开启';
  }
  soundBtn.addEventListener('click', () => {
    Sound.setEnabled(!Sound.isOn());
    renderSoundBtn();
  });
  renderSoundBtn();

  // 首次交互解锁音频上下文
  window.addEventListener('pointerdown', Sound.unlock, { passive: true });
  window.addEventListener('keydown', Sound.unlock);

  /* ---------- 布局 ---------- */

  function computeCell() {
    const availW = Math.min(document.documentElement.clientWidth - 36, 470);
    const availH = window.innerHeight - 205;
    return Math.floor(Math.max(250, Math.min(availW, availH)) / SIZE);
  }

  function layout() {
    cell = computeCell();
    const px = cell * SIZE;
    boardEl.style.width = px + 'px';
    boardEl.style.height = px + 'px';
    boardEl.style.setProperty('--cell', cell + 'px');
    boardEl.style.setProperty('--fruit-size', Math.round(cell * 0.6) + 'px');
    wrapEl.style.width = (px + 18) + 'px';
    for (const row of board) {
      for (const t of row) {
        if (!t) continue;
        t.el.style.width = t.el.style.height = cell + 'px';
        setPos(t);
      }
    }
  }

  /* ---------- 棋盘数据 ---------- */

  // 生成一个开局无现成消除的类型矩阵
  function genTypes() {
    const t = [];
    for (let r = 0; r < SIZE; r++) {
      t[r] = [];
      for (let c = 0; c < SIZE; c++) {
        let v;
        do {
          v = randType();
        } while (
          (c >= 2 && t[r][c - 1] === v && t[r][c - 2] === v) ||
          (r >= 2 && t[r - 1][c] === v && t[r - 2][c] === v)
        );
        t[r][c] = v;
      }
    }
    return t;
  }

  // 判断 (r,c) 处是否处于三连中
  function matchAt(t, r, c) {
    const v = t[r][c];
    let h = 1;
    for (let i = c - 1; i >= 0 && t[r][i] === v; i--) h++;
    for (let i = c + 1; i < SIZE && t[r][i] === v; i++) h++;
    if (h >= 3) return true;
    let s = 1;
    for (let i = r - 1; i >= 0 && t[i][c] === v; i--) s++;
    for (let i = r + 1; i < SIZE && t[i][c] === v; i++) s++;
    return s >= 3;
  }

  // 矩阵上是否存在可行的交换
  function hasMoveTypes(t) {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        for (const [dr, dc] of [[0, 1], [1, 0]]) {
          const r2 = r + dr, c2 = c + dc;
          if (r2 >= SIZE || c2 >= SIZE) continue;
          if (t[r][c] === t[r2][c2]) continue;
          const a = t[r][c];
          t[r][c] = t[r2][c2]; t[r2][c2] = a;
          const ok = matchAt(t, r, c) || matchAt(t, r2, c2);
          t[r2][c2] = t[r][c]; t[r][c] = a;
          if (ok) return true;
        }
      }
    }
    return false;
  }

  function hasMoveLive() {
    const t = board.map(row => row.map(x => x.type));
    return hasMoveTypes(t);
  }

  /* ---------- DOM tile ---------- */

  function createTile(type, r, c) {
    const el = document.createElement('div');
    el.className = 'tile t' + type;
    const inner = document.createElement('div');
    inner.className = 'tile-inner';
    inner.textContent = FRUITS[type];
    el.appendChild(inner);
    el.style.width = el.style.height = cell + 'px';
    const tile = { type, r, c, el };
    el.__tile = tile;
    boardEl.appendChild(el);
    return tile;
  }

  function setPos(tile, r = tile.r, c = tile.c) {
    tile.el.style.transform = 'translate(' + (c * cell) + 'px,' + (r * cell) + 'px)';
  }

  function buildBoard() {
    boardEl.innerHTML = '';
    let types;
    do {
      types = genTypes();
    } while (!hasMoveTypes(types));
    board = types.map((row, r) => row.map((v, c) => {
      const t = createTile(v, r, c);
      t.el.classList.add('born');
      setPos(t);
      return t;
    }));
  }

  /* ---------- HUD / 提示 ---------- */

  function updateHUD() {
    scoreEl.textContent = score;
    movesEl.textContent = moves;
    movesBox.classList.toggle('low', moves <= 5 && moves > 0);
  }

  let toastTimer = null;
  function showToast(msg, dur = 1500) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), dur);
  }

  function showCombo(n) {
    const suffix = n >= 5 ? ' 🚀 超神！' : n >= 4 ? ' 💥 太猛了！' : n >= 3 ? ' 🔥 厉害！' : ' 👏';
    comboEl.textContent = '连消 ×' + n + suffix;
    comboEl.classList.remove('show');
    void comboEl.offsetWidth;
    comboEl.classList.add('show');
  }

  function spawnFloat(colCenter, rowCenter, text, combo) {
    const el = document.createElement('div');
    el.className = 'float-text' + (combo > 1 ? ' combo' : '');
    el.textContent = text;
    el.style.left = ((colCenter + 0.5) * cell) + 'px';
    el.style.top = (rowCenter * cell + cell * 0.1) + 'px';
    boardEl.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  /* ---------- 选择与输入 ---------- */

  function clearSelection() {
    if (selected) {
      selected.el.classList.remove('selected');
      selected = null;
    }
  }

  function activateTile(tile) {
    if (busy || gameOver || !tile) return;
    // 防御：选中的 tile 已失效
    if (selected && board[selected.r][selected.c] !== selected) {
      clearSelection();
    }
    if (selected === tile) { clearSelection(); return; }
    if (selected && Math.abs(selected.r - tile.r) + Math.abs(selected.c - tile.c) === 1) {
      const a = selected;
      clearSelection();
      trySwap(a, tile);
    } else {
      clearSelection();
      selected = tile;
      tile.el.classList.add('selected');
      Sound.tap();
    }
  }

  let drag = null;
  boardEl.addEventListener('pointerdown', e => {
    const el = e.target.closest('.tile');
    if (!el || busy || gameOver) return;
    e.preventDefault();
    drag = { x: e.clientX, y: e.clientY, tile: el.__tile };
  });
  window.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x;
    const dy = e.clientY - drag.y;
    if (Math.hypot(dx, dy) > Math.max(18, cell * 0.4)) {
      const horiz = Math.abs(dx) > Math.abs(dy);
      const dr = horiz ? 0 : (dy > 0 ? 1 : -1);
      const dc = horiz ? (dx > 0 ? 1 : -1) : 0;
      const r2 = drag.tile.r + dr;
      const c2 = drag.tile.c + dc;
      if (r2 >= 0 && r2 < SIZE && c2 >= 0 && c2 < SIZE && board[r2][c2]) {
        clearSelection();
        trySwap(drag.tile, board[r2][c2]);
      }
      drag = null;
    }
  });
  window.addEventListener('pointerup', () => {
    if (!drag) return;
    const t = drag.tile;
    drag = null;
    activateTile(t);
  });
  window.addEventListener('pointercancel', () => { drag = null; });

  /* ---------- 核心玩法 ---------- */

  function swapData(a, b) {
    board[a.r][a.c] = b;
    board[b.r][b.c] = a;
    const r = a.r, c = a.c;
    a.r = b.r; a.c = b.c;
    b.r = r; b.c = c;
    setPos(a);
    setPos(b);
  }

  // 找出所有三连以上的横 / 竖 run
  function findRuns() {
    const runs = [];
    for (let r = 0; r < SIZE; r++) {
      let c = 0;
      while (c < SIZE) {
        const t = board[r][c];
        if (!t) { c++; continue; }
        let e = c + 1;
        while (e < SIZE && board[r][e] && board[r][e].type === t.type) e++;
        if (e - c >= 3) {
          const cells = [];
          for (let i = c; i < e; i++) cells.push([r, i]);
          runs.push({ cells });
        }
        c = e;
      }
    }
    for (let c = 0; c < SIZE; c++) {
      let r = 0;
      while (r < SIZE) {
        const t = board[r][c];
        if (!t) { r++; continue; }
        let e = r + 1;
        while (e < SIZE && board[e][c] && board[e][c].type === t.type) e++;
        if (e - r >= 3) {
          const cells = [];
          for (let i = r; i < e; i++) cells.push([i, c]);
          runs.push({ cells });
        }
        r = e;
      }
    }
    return runs;
  }

  async function trySwap(a, b) {
    if (busy || gameOver) return;
    busy = true;
    const g = gen;
    Sound.swap();
    swapData(a, b);
    await sleep(280);
    if (g !== gen) return;

    if (findRuns().length === 0) {
      // 无效交换：换回并抖动提示
      swapData(a, b);
      Sound.invalid();
      a.el.classList.add('invalid');
      b.el.classList.add('invalid');
      await sleep(360);
      if (g !== gen) return;
      a.el.classList.remove('invalid');
      b.el.classList.remove('invalid');
      busy = false;
      return;
    }

    moves = Math.max(0, moves - 1);
    updateHUD();
    await resolveBoard(g);
    if (g !== gen) return;
    afterTurn(g);
  }

  async function resolveBoard(g) {
    let combo = 0;
    while (true) {
      const runs = findRuns();
      if (!runs.length) break;
      combo++;

      const doomed = new Set();
      for (const run of runs) {
        const pts = run.cells.length * POINTS * combo;
        score += pts;
        const rr = run.cells.reduce((s, p) => s + p[0], 0) / run.cells.length;
        const cc = run.cells.reduce((s, p) => s + p[1], 0) / run.cells.length;
        spawnFloat(cc, rr, '+' + pts, combo);
        for (const [r, c] of run.cells) doomed.add(board[r][c]);
      }
      updateHUD();
      if (combo >= 2) showCombo(combo);
      Sound.match(combo);

      for (const t of doomed) t.el.classList.add('pop');
      await sleep(340);
      if (g !== gen) return;

      for (const t of doomed) {
        t.el.remove();
        board[t.r][t.c] = null;
      }
      applyGravity();
      await sleep(330);
      if (g !== gen) return;
    }
  }

  // 重力下落 + 顶部补充新水果
  function applyGravity() {
    const spawned = [];
    for (let c = 0; c < SIZE; c++) {
      let write = SIZE - 1;
      for (let r = SIZE - 1; r >= 0; r--) {
        const t = board[r][c];
        if (!t) continue;
        if (write !== r) {
          board[write][c] = t;
          board[r][c] = null;
          t.r = write;
          setPos(t);
        }
        write--;
      }
      const emptyCount = write + 1;
      for (let r = write; r >= 0; r--) {
        const t = createTile(randType(), r, c);
        setPos(t, r - emptyCount, c); // 初始停在棋盘上方
        board[r][c] = t;
        spawned.push(t);
      }
    }
    if (spawned.length) {
      void boardEl.offsetHeight; // 强制回流，确保起始位置先生效
      for (const t of spawned) setPos(t); // 再落到最终位置，触发下落过渡
    }
    Sound.drop();
  }

  /* ---------- 回合收尾 ---------- */

  function afterTurn(g) {
    if (moves <= 0) { endGame(); return; }
    if (!hasMoveLive()) {
      Sound.noMoves();
      showToast('😵 没有可用步数，自动重新洗牌！', 1400);
      setTimeout(() => { if (g === gen) reshuffle(); }, 1500);
    } else {
      busy = false;
    }
  }

  async function reshuffle() {
    busy = true;
    const g = gen;
    Sound.shuffle();
    for (const row of board) {
      for (const t of row) {
        if (t) t.el.classList.add('shuffle-out');
      }
    }
    await sleep(380);
    if (g !== gen) return;
    buildBoard();
    busy = false;
  }

  function endGame() {
    gameOver = true;
    finalScoreEl.textContent = score;
    Sound.over();
    overlayEl.classList.remove('hidden');
    overlayCard.style.animation = 'none';
    void overlayCard.offsetWidth;
    overlayCard.style.animation = '';
  }

  function startNew() {
    gen++;
    score = 0;
    moves = START_MOVES;
    gameOver = false;
    busy = false;
    selected = null;
    updateHUD();
    buildBoard();
    Sound.start();
  }

  /* ---------- 启动 ---------- */

  document.getElementById('restartBtn').addEventListener('click', startNew);
  document.getElementById('againBtn').addEventListener('click', () => {
    overlayEl.classList.add('hidden');
    startNew();
  });

  layout();
  startNew();
  window.addEventListener('resize', layout);
})();
</script>
</body>
